<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">

<style>
:root{
  --lacquer:#0C1714;
  --felt:#173229;
  --felt-2:#1E4034;
  --bone:#F0E7D4;
  --bone-2:#DCCFB4;
  --pip:#1A1714;
  --brass:#DFA83C;
  --brass-dim:#8A6A25;
  --firuze:#33A6A0;
  --nar:#B93A38;
  --plum:#8E6BB0;
  --ink-70:rgba(240,231,212,.70);
  --ink-45:rgba(240,231,212,.45);
  --ink-20:rgba(240,231,212,.20);
  --ink-10:rgba(240,231,212,.10);
  --r:10px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--bone);
  background:
    radial-gradient(120% 80% at 50% -10%, #1B3A2E 0%, #0C1714 62%, #070F0D 100%);
  min-height:100vh;
  font-variant-numeric:tabular-nums;
  overscroll-behavior:none;
}
#app{max-width:520px;margin:0 auto;padding:10px 12px 18px;position:relative}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shared atoms ---------- */
.plate{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(0,0,0,.18));
  border:1px solid var(--ink-10);
  border-radius:var(--r);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:9px;font-weight:600;letter-spacing:.01em;
  background:linear-gradient(180deg,#E8B44C,#C08C22);
  color:#241703;border:1px solid #F0CA78;
  box-shadow:0 2px 0 #6E5015,0 8px 18px rgba(0,0,0,.35);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #6E5015,0 4px 10px rgba(0,0,0,.35)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn--ghost{
  background:rgba(240,231,212,.06);color:var(--bone);border:1px solid var(--ink-20);
  box-shadow:none;font-weight:600;
}
.btn--ghost:active{transform:translateY(1px)}
.btn--wide{width:100%}
input.field{
  width:100%;padding:13px 14px;border-radius:9px;background:rgba(0,0,0,.3);
  border:1px solid var(--ink-20);color:var(--bone);font:inherit;letter-spacing:.02em;
}
input.field::placeholder{color:rgba(240,231,212,.3)}
.muted{color:var(--ink-45);font-size:13px;line-height:1.5}
.hair{height:1px;background:var(--ink-10);margin:14px 0}

/* ---------- masthead ---------- */
.mast{display:flex;align-items:baseline;gap:10px;padding:2px 2px 12px}
.mast h1{
  margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;
  font-stretch:condensed;
}
.mast h1 .dot{color:var(--brass)}
.mast .sub{font-size:12.5px;color:var(--ink-45);margin-left:auto;text-align:right;line-height:1.35}

/* ---------- home ---------- */
.hero-tiles{display:flex;gap:8px;justify-content:center;padding:16px 0 22px;perspective:600px}
.hero-tiles .tile{animation:heroIn .7s cubic-bezier(.2,.9,.25,1.15) backwards}
.hero-tiles .tile:nth-child(1){animation-delay:.03s}
.hero-tiles .tile:nth-child(2){animation-delay:.11s}
.hero-tiles .tile:nth-child(3){animation-delay:.19s}
.hero-tiles .tile:nth-child(4){animation-delay:.27s}
@keyframes heroIn{from{opacity:0;transform:translateY(-30px) rotateX(50deg) rotate(-8deg)}}
.card{padding:16px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.codein{text-transform:uppercase;letter-spacing:.28em;font-size:20px;text-align:center;font-weight:600}

/* ---------- lobby ---------- */
.roomcode{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(223,168,60,.14),rgba(223,168,60,.04));
  border:1px solid rgba(223,168,60,.35);
}
.roomcode b{font-size:32px;letter-spacing:.2em;font-weight:800;color:var(--brass);line-height:1}
.seatlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.seatrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:rgba(0,0,0,.22);border:1px solid var(--ink-10)}
.ava{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:13px;color:#0C1714;flex:0 0 auto;
}
.seatrow .nm{font-weight:600;font-size:15px}
.seatrow .tag{margin-left:auto;font-size:11.5px;color:var(--ink-45)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:9px 14px;border-radius:999px;border:1px solid var(--ink-20);
  background:rgba(0,0,0,.22);font-size:14px;font-weight:600;color:var(--ink-70);
}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#241703}

/* ---------- scoreboard ---------- */
.topbar{display:flex;flex-direction:column}
.board-head{display:flex;gap:8px;margin-bottom:10px}
.sideplate{
  flex:1;padding:9px 11px;border-radius:9px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.25));
  border:1px solid var(--ink-10);border-left:3px solid var(--sc);
}
.sideplate .nm{font-size:11.5px;color:var(--ink-45);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sideplate .sc{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.sideplate.is-lead .sc{color:var(--brass)}
.seatstrip{display:flex;gap:6px;margin-bottom:10px}
.seatpip{
  flex:1;padding:7px 6px;border-radius:8px;background:rgba(0,0,0,.24);
  border:1px solid var(--ink-10);text-align:center;min-width:0;
  transition:border-color .2s,background .2s;
}
.seatpip .n{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-70)}
.seatpip .c{font-size:11px;color:var(--ink-45);margin-top:2px}
.seatpip.is-turn{border-color:var(--brass);background:rgba(223,168,60,.14)}
.seatpip.is-turn .n{color:var(--brass)}
.seatpip.off{opacity:.4}
.seatpip.off .c{color:#E9A0A0}
.wire{
  display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:9px;
  border-radius:9px;background:rgba(233,160,160,.1);border:1px solid rgba(233,160,160,.35);
  font-size:13px;font-weight:600;color:#F0C6C6;
}
.wire .lamp{background:#E9A0A0}

/* ---------- felt / board ---------- */
.felt{
  position:relative;border-radius:14px;padding:10px 0 8px;margin-bottom:10px;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 2px,transparent 2px 7px),
    linear-gradient(180deg,var(--felt-2),var(--felt));
  border:1px solid rgba(0,0,0,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -14px 30px rgba(0,0,0,.3);
}
.ends{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:2px 10px 8px;font-size:13px;color:var(--ink-45);
}
.ends .v{
  min-width:26px;height:26px;padding:0 6px;display:grid;place-items:center;border-radius:7px;
  background:rgba(0,0,0,.3);border:1px solid var(--ink-20);font-weight:700;color:var(--bone);font-size:14px;
}
.ends .tot{
  height:30px;padding:0 12px;display:grid;place-items:center;border-radius:999px;
  border:1px solid var(--ink-20);font-weight:800;font-size:15px;color:var(--ink-70);
}
.ends.is-score .tot{background:var(--brass);border-color:var(--brass);color:#241703;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(223,168,60,.45)}50%{box-shadow:0 0 0 8px rgba(223,168,60,0)}}
.lane{
  overflow:hidden;padding:8px 15px 10px;min-height:86px;
  display:flex;align-items:center;justify-content:center;
}
.table{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 auto}
.mainline{display:flex;align-items:center;gap:5px}
.chain{display:flex;flex-direction:column;gap:5px;margin:0 auto}
.armrows{display:flex;flex-direction:column;gap:5px;min-width:0}
.arm{
  display:flex;align-items:center;gap:8px;padding:5px 8px 5px 6px;border-radius:9px;
  background:rgba(0,0,0,.2);border:1px solid rgba(223,168,60,.22);
}
.arm .tether{
  font-size:10px;font-weight:700;color:var(--brass);opacity:.85;flex:0 0 auto;
  text-transform:uppercase;letter-spacing:.07em;line-height:1.2;text-align:center;
}
.arm .tether b{display:block;font-size:13px}
.tile.spin{
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -2px 4px rgba(120,100,60,.25) inset,
             0 0 0 2px var(--brass),0 3px 8px rgba(0,0,0,.5);
}
.slot{
  flex:0 0 auto;width:calc(var(--unit)*1.4);height:calc(var(--unit)*1.5);
  border-radius:6px;border:2px dashed var(--brass);background:rgba(223,168,60,.16);
  animation:pulse 1.5s ease-in-out infinite;
}
.slot:active{background:rgba(223,168,60,.34)}
.picker.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crow{display:flex;gap:3px;align-items:center;justify-content:flex-start}
.crow.rev{flex-direction:row-reverse}
.empty-felt{width:100%;text-align:center;color:rgba(240,231,212,.28);font-size:13.5px;padding:26px 20px}

/* ---------- tiles ---------- */
.tile{
  --w:46px;--h:92px;
  width:var(--w);height:var(--h);flex:0 0 auto;border-radius:7px;position:relative;
  background:linear-gradient(160deg,#FBF5E7 0%,var(--bone) 42%,var(--bone-2) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 -2px 4px rgba(120,100,60,.25) inset,0 3px 6px rgba(0,0,0,.45);
  display:flex;flex-direction:column;padding:3px;gap:0;
}
.tile.h{flex-direction:row}
.tile::after{
  content:"";position:absolute;background:rgba(26,23,20,.5);border-radius:2px;
}
.tile:not(.h)::after{left:22%;right:22%;top:calc(50% - .5px);height:1px}
.tile.h::after{top:22%;bottom:22%;left:calc(50% - .5px);width:1px}
.half{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11%;gap:4%}
.pip{border-radius:50%;background:radial-gradient(circle at 32% 30%,#4A433A,var(--pip));box-shadow:0 .5px .5px rgba(255,255,255,.35)}
.pip.p6{background:radial-gradient(circle at 32% 30%,#7E2B2A,#8E1D1C)}
/* board tiles — --unit is set per render so the whole layout stays visible */
.table{--unit:34px}
.table .tile{--w:var(--unit);--h:calc(var(--unit)*2);border-radius:5px}
.table .tile.h{--w:calc(var(--unit)*2);--h:var(--unit)}
.table .tile.is-new{animation:land .42s cubic-bezier(.18,.85,.3,1.25)}
@keyframes land{
  0%{transform:translateY(-38px) rotate(-11deg) scale(1.14);opacity:0}
  55%{transform:translateY(3px) rotate(2deg) scale(1);opacity:1}
  75%{transform:translateY(-2px) rotate(-1deg)}
  100%{transform:none}
}
/* hand tiles */
.hand{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 10px}
.hand::-webkit-scrollbar{display:none}
.hand{--hunit:44px}
.hand .tile{--w:var(--hunit);--h:calc(var(--hunit)*2);transition:transform .16s ease,box-shadow .16s ease,filter .16s}
.hand .tile.playable{cursor:pointer}
.hand .tile.dead{filter:saturate(.35) brightness(.62)}
.hand .tile.sel{transform:translateY(-12px);box-shadow:0 3px 6px rgba(0,0,0,.45),0 0 0 2px var(--brass),0 12px 22px rgba(0,0,0,.5)}
.hand .tile.shake{animation:shake .34s}

<script>
/* ============================================================
   TELEFON — Azerbaijani all-fives dominoes, one phone per player
   ============================================================ */

const A = document.getElementById('app');
const rnd = (n)=>Math.floor(Math.random()*n);
const nearest5 = (v)=>Math.round(v/5)*5;
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SIDE_COLORS = ['var(--firuze)','var(--nar)','var(--brass)','var(--plum)'];
const TEAM_NAMES  = ['Firuzə','Nar'];
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

/* ---------- persistence ---------- */
function lget(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lset(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- local session ---------- */
let ME = { id:null, name:'' };
let G = null;                       // shared game state
let LOCAL = false;                  // pass-and-play on one device
let UI = { sel:null, code:'', animUpTo:0, sound:true, err:'', lastSeq:-1 };
const NET = { role:'idle', peer:null, conns:new Map(), host:null, status:'', seen:new Map(), hostSeen:0 };
const PREFIX = 'tlfn-v1-';

/* Signalling only — no game data ever touches this server; the two phones talk
   directly once introduced. Default is the free public PeerJS broker, no signup.
   To run your own (peerjs-server on any box), replace with e.g.
   { host:'peer.yourdomain.com', port:443, secure:true, path:'/' }
   Add `config:{iceServers:[...]}` here if you ever need a TURN relay for
   players on locked-down mobile networks. */
const ICE = { iceServers:[
  { urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] },
  { urls:'stun:global.stun.twilio.com:3478' }
]};
const PEER_OPTS = (()=>{
  const q = new URLSearchParams(location.search).get('peer');
  if(!q) return { debug:0, config:ICE };
  const [host, port] = q.split(':');
  return { debug:0, config:ICE, host, port: +(port||9000), path:'/', secure: location.protocol==='https:' };
})();

/* A preview/embed frame blocks the connection a table needs. Worth saying so. */
const EMBEDDED = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
const FILEURL  = location.protocol === 'file:';

/* Keep the last few real errors so a failure is legible instead of "Script error." */
const ERRLOG = [];
function noteErr(msg){
  msg = String(msg||'').slice(0,200);
  if(!msg || ERRLOG[ERRLOG.length-1]===msg) return;
  ERRLOG.push(msg); if(ERRLOG.length>4) ERRLOG.shift();
}
window.addEventListener('error', e=>noteErr(e.message));
window.addEventListener('unhandledrejection', e=>noteErr(e.reason && e.reason.message || e.reason));

/* ============================================================
   Game engine (pure functions on state)
   ============================================================ */

function fullSet(){ const t=[]; for(let a=0;a<=6;a++) for(let b=a;b<=6;b++) t.push([a,b]); return t; }
function shuffled(){ const t=fullSet(); for(let i=t.length-1;i>0;i--){ const j=rnd(i+1); [t[i],t[j]]=[t[j],t[i]]; } return t; }
function pips(t){ return t[0]+t[1]; }
function handPips(h){ return h.reduce((s,t)=>s+pips(t),0); }
function isDouble(t){ return t[0]===t[1]; }

function sideOf(g, seatIdx){ return g.mode==='teams' ? seatIdx%2 : seatIdx; }
function sideCount(g){ return g.mode==='teams' ? 2 : g.players.length; }
function sideName(g, s){ 
  if(g.mode==='teams') return TEAM_NAMES[s];
  return g.players[s] ? g.players[s].name : '—';
}
function sideMembers(g, s){
  return g.players.filter((p,i)=>sideOf(g,i)===s);
}

/* ---------- the layout ----------
   line : the main row, chain order, t[0] faces left / t[1] faces right
   sp   : index in `line` of the spinner (the first double played, and only that one)
   a, b : the two branch arms off the spinner's long sides; t[0] faces the spinner
   Arms only open once both sides of the spinner are covered (pagat/All Fives). */
function newBoard(){ return { line:[], a:[], b:[], sp:null }; }
function bCount(b){ return b.line.length + b.a.length + b.b.length; }
function armsOpen(b){ return b.sp!=null && b.sp>0 && b.sp < b.line.length-1; }
function spinVal(b){ return b.sp!=null ? b.line[b.sp].t[0] : null; }

/* every open end: what it matches, and what it contributes to the count */
function endsInfo(b){
  const L=b.line;
  if(!L.length) return { total:0, list:[] };
  if(L.length===1){
    const x=L[0];
    return {
      total: x.d ? x.t[0]*2 : x.t[0]+x.t[1],
      list: [{side:'l', match:x.t[0]}, {side:'r', match:x.t[1]}],
      lone: true
    };
  }
  const f=L[0], k=L[L.length-1];
  const list=[
    { side:'l', match:f.t[0], val: f.d ? f.t[0]*2 : f.t[0] },
    { side:'r', match:k.t[1], val: k.d ? k.t[1]*2 : k.t[1] }
  ];
  if(armsOpen(b)){
    const n=spinVal(b);
    for(const key of ['a','b']){
      const arm=b[key];
      if(arm.length){
        const z=arm[arm.length-1];
        list.push({ side:key, match:z.t[1], val: z.d ? z.t[1]*2 : z.t[1] });
      } else {
        // playable, but a bare spinner side contributes nothing once both its sides are covered
        list.push({ side:key, match:n, val:0, empty:true });
      }
    }
  }
  return { total: list.reduce((s,e)=>s+(e.val||0),0), list };
}

function fitSides(b, t){
  const res={};
  if(!b.line.length){ res.r=true; return res; }
  for(const e of endsInfo(b).list) if(t[0]===e.match || t[1]===e.match) res[e.side]=true;
  return res;
}
function canPlayAny(b, hand){
  if(!b.line.length) return hand.length>0;
  return hand.some(t=>Object.keys(fitSides(b,t)).length>0);
}

function place(b, t, side){
  const d = isDouble(t);
  if(!b.line.length){
    b.line.push({t:t.slice(), d});
    if(d) b.sp=0;
    return;
  }
  const e = endsInfo(b).list.find(x=>x.side===side);
  if(!e) return;
  const m = e.match;
  const outer = (t[0]===m) ? t[1] : t[0];
  if(side==='l'){
    b.line.unshift({t:[outer, m], d});
    if(b.sp!=null) b.sp++;          // the spinner shifted one place along
    else if(d) b.sp=0;              // first double played -> this is the spinner
  } else if(side==='r'){
    b.line.push({t:[m, outer], d});
    if(b.sp==null && d) b.sp=b.line.length-1;
  } else {
    b[side].push({t:[m, outer], d});
  }
}

function previewCount(b, t, side){
  const c = JSON.parse(JSON.stringify(b));
  place(c, t, side);
  return endsInfo(c).total;
}

function newGame(code, host){
  return {
    v:1, code, host:host.id, mode:'teams', target:200, phase:'lobby',
    players:[{id:host.id,name:host.name}],
    scores:[0,0], sheet:[], roundNo:0, round:null, over:null, lastAct:null
  };
}

function startRound(g){
  const n = g.players.length;
  const deck = shuffled();
  const hands = {};
  g.players.forEach((p,i)=>{ hands[p.id] = deck.slice(i*7,(i+1)*7).sort((a,b)=>pips(b)-pips(a)||b[0]-a[0]); });
  const bone = deck.slice(n*7);

  // who leads: first round -> highest double (else heaviest tile); later -> last round's winner
  let lead = 0;
  if(g.roundNo===0 || g.lastWinnerSeat==null){
    let best=-1;
    g.players.forEach((p,i)=>{
      hands[p.id].forEach(t=>{
        const rank = isDouble(t) ? 100+t[0] : pips(t);
        if(rank>best){ best=rank; lead=i; }
      });
    });
  } else {
    lead = g.lastWinnerSeat;
  }

  g.roundNo++;
  g.round = {
    hands, bone, board:newBoard(), turn:lead, lead, passes:0,
    gained:new Array(sideCount(g)).fill(0), log:[], drew:0
  };
  g.phase='playing';
  g.lastAct={type:'deal', seat:lead};
}

function award(g, side, pts, why){
  g.round.gained[side]+=pts;
  g.scores[side]+=pts;
  g.round.log.push({side, pts, why});
}

function doPlay(g, seat, tileIdx, side){
  const r=g.round, pid=g.players[seat].id, hand=r.hands[pid];
  const t = hand[tileIdx];
  place(r.board, t, r.board.line.length ? side : 'r');
  hand.splice(tileIdx,1);
  r.passes=0; r.drew=0;
  const cnt = endsInfo(r.board).total;
  let got=0;
  if(cnt>0 && cnt%5===0){ got=cnt; award(g, sideOf(g,seat), cnt, 'count'); }
  g.lastAct={type:'play', seat, tile:t, side, count:cnt, got};
  if(hand.length===0){ endRound(g,'domino',seat); return; }
  advance(g);
}

function doDraw(g, seat){
  const r=g.round, pid=g.players[seat].id;
  if(!r.bone.length) return;
  r.hands[pid].push(r.bone.pop());
  r.hands[pid].sort((a,b)=>pips(b)-pips(a)||b[0]-a[0]);
  r.drew++;
  g.lastAct={type:'draw', seat};
}

function doPass(g, seat){
  const r=g.round;
  r.passes++; r.drew=0;
  g.lastAct={type:'pass', seat};
  if(r.passes>=g.players.length){ endRound(g,'block',null); return; }
  advance(g);
}

function advance(g){
  g.round.turn = (g.round.turn+1)%g.players.length;
}

function endRound(g, reason, winSeat){
  const r=g.round, ns=sideCount(g);
  let winner=null, pts=0;

  if(reason==='domino'){
    winner = sideOf(g, winSeat);
    g.lastWinnerSeat = winSeat;
    let sum=0;
    g.players.forEach((p,i)=>{ if(sideOf(g,i)!==winner) sum+=handPips(r.hands[p.id]); });
    pts = nearest5(sum);
  } else {
    // blocked: lowest pip total wins
    const tot=new Array(ns).fill(0);
    g.players.forEach((p,i)=>{ tot[sideOf(g,i)]+=handPips(r.hands[p.id]); });
    const min=Math.min(...tot);
    const tied=tot.filter(x=>x===min).length;
    if(tied>1){ winner=null; pts=0; }
    else{
      winner=tot.indexOf(min);
      pts=nearest5(tot.reduce((s,x,i)=>s+(i===winner?0:x),0));
      // seat of the lowest hand on winning side leads next
      let bestSeat=null,bestP=99;
      g.players.forEach((p,i)=>{ if(sideOf(g,i)===winner){ const h=handPips(r.hands[p.id]); if(h<bestP){bestP=h;bestSeat=i;} } });
      g.lastWinnerSeat=bestSeat;
    }
  }
  if(winner!=null && pts>0) award(g, winner, pts, reason);

  g.sheet.push({
    n:g.roundNo, gained:r.gained.slice(), totals:g.scores.slice(),
    reason, winner, bonus:pts, by: winSeat!=null ? g.players[winSeat].name : null
  });

  // match over?
  const best=Math.max(...g.scores);
  const second=g.scores.length>1 ? Math.max(...g.scores.filter((_,i)=>i!==g.scores.indexOf(best))) : 0;
  if(best>=g.target && best-second>=10){
    g.phase='matchover'; g.over={side:g.scores.indexOf(best)};
  } else {
    g.phase='roundover';
  }
  g.endInfo={reason, winner, pts, winSeat};

  if(typeof rtSys==='function'){
    const nm = s => g.mode==='teams' ? TEAM_NAMES[s] : sideName(g, s);
    rtSys(winner==null ? `Round ${g.roundNo} drawn — nothing scored`
        : reason==='domino' ? `${g.players[winSeat].name} went out · ${nm(winner)} +${pts}`
        : `Table locked · ${nm(winner)} +${pts}`);
  }
}

/* ============================================================
   Sync
   ============================================================ */
/* The host's phone is the server. Guests connect straight to it over WebRTC
   (PeerJS public broker is used only to introduce the two browsers). */

function sync(){                       // state changed on the host / hot-seat device
  if(!G) return;
  G.seq = (G.seq||0)+1;
  if(NET.role==='host'){
    G.online = G.players.map(p => p.id===ME.id || NET.conns.has(p.id));
    G.peers = {};
    if(NET.peer && NET.peer.id) G.peers[ME.id] = NET.peer.id;
    NET.conns.forEach((c,pid)=>{ if(c.peer) G.peers[pid] = c.peer; });
    lset('save', { code:G.code, at:Date.now(), g:G });
  }
  render();
  if(NET.role==='host'){ broadcast(); voiceSync(); }
}

function viewFor(pid){                 // hide everyone else's tiles
  const g = JSON.parse(JSON.stringify(G));
  if(g.round){
    const h={};
    for(const p of g.players) h[p.id] = (p.id===pid) ? g.round.hands[p.id] : g.round.hands[p.id].map(()=>[0,0]);
    g.round.hands = h;
    g.round.bone = g.round.bone.map(()=>[0,0]);
  }
  return g;
}
function broadcast(){
  NET.conns.forEach((c,pid)=>{ try{ if(c.open) c.send({t:'state', g:viewFor(pid)}); }catch(e){} });
}

function act(msg){                     // every player funnels moves through here
  if(NET.role==='guest'){
    if(NET.host && NET.host.open) NET.host.send({t:'act', a:msg});
    else toast('Lost the table — check your connection');
    return;
  }
  applyAction(LOCAL ? null : ME.id, msg);
}

function applyAction(pid, msg){        // runs on the host only
  if(!G || G.phase!=='playing' || !G.round) return;
  const seat = LOCAL ? G.round.turn : G.players.findIndex(p=>p.id===pid);
  if(seat<0 || G.round.turn!==seat) return;
  const hand = G.round.hands[G.players[seat].id];
  if(msg.type==='play'){
    const t = hand[msg.i]; if(!t) return;
    const f = fitSides(G.round.board, t);
    if(G.round.board.line.length && !f[msg.side]) return;
    doPlay(G, seat, msg.i, msg.side);
  } else if(msg.type==='draw'){
    if(!G.round.bone.length || canPlayAny(G.round.board,hand)) return;
    doDraw(G, seat);
  } else if(msg.type==='pass'){
    if(G.round.bone.length || canPlayAny(G.round.board,hand)) return;
    doPass(G, seat);
  } else return;
  sync();
}

function explainPeerError(e){
  switch(e.type){
    case 'browser-incompatible': return 'This browser cannot open tables. Try Chrome, Safari or Firefox.';
    case 'ssl-unavailable':      return 'Blocked as insecure. Serve the page over https, or over plain http on a local network.';
    case 'server-error':
    case 'socket-error':
    case 'socket-closed':
    case 'network':
      if(EMBEDDED) return 'This page is running inside a preview frame, which blocks the connection a table needs. Open it at its own address and try again.';
      return 'Could not reach the matchmaking server. It may be down or blocked on this network — see the connection notes below.';
    default: return 'Could not open the table ('+e.type+'). See the connection notes below.';
  }
}

/* ---------- host ---------- */
function newCode(){ let c=''; for(let i=0;i<4;i++) c+=ALPHA[rnd(ALPHA.length)]; return c; }

setInterval(()=>{
  if(NET.role!=='host' || !NET.peer || NET.peer.destroyed) return;
  const want = NET.peer.disconnected ? 'reconnecting' : 'ready';
  if(NET.status!==want){ NET.status=want; render(); }
  if(NET.peer.disconnected) hostWake();
}, 2500);

/* A data channel can die without ever firing `close` — a phone that slept on
   mobile data just stops answering. Ping every guest and drop the ones that
   have gone quiet, so `away` on the seat strip means something. */
const PING_EVERY = 4000, DEAD_AFTER = 14000;
setInterval(()=>{
  const now = Date.now();
  if(NET.role==='host'){
    let lost = false;
    NET.conns.forEach((c,pid)=>{
      try{ if(c.open) c.send({t:'ping'}); }catch(e){}
      const seen = NET.seen.get(pid) || 0;
      if(now - seen > DEAD_AFTER){
        try{ c.close(); }catch(e){}
        NET.conns.delete(pid); NET.seen.delete(pid); lost = true;
      }
    });
    if(lost) sync();
  } else if(NET.role==='guest' && NET.joined){
    const c = NET.host;
    try{ if(c && c.open) c.send({t:'ping'}); }catch(e){}
    if(now - (NET.hostSeen || 0) > DEAD_AFTER && NET.status!=='reconnecting'){
      NET.status='reconnecting'; render();
      guestRetry(G ? G.code : UI.code);
    }
  }
  voiceSync();                 // heal any call that failed to place
}, PING_EVERY);

function hostWake(){
  const peer=NET.peer;
  if(!peer || peer.destroyed || !peer.disconnected) return;
  try{ peer.reconnect(); }catch(e){ noteErr('reconnect: '+e.message); }
}

function hostRoom(tries, fixedCode, restore){
  if(typeof Peer==='undefined'){ UI.err='Networking script did not load. Reload the page.'; NET.status=''; render(); return; }
  const code = fixedCode || newCode();
  NET.role='host'; NET.status='connecting'; UI.err=''; render();
  const peer = new Peer(PREFIX+code, PEER_OPTS);
  NET.peer = peer;
  voiceAttach(peer);

  peer.on('open', ()=>{
    NET.status='ready';
    SAVED = null;
    if(!G) G = restore || newGame(code, ME);
    if(restore){ G.host = ME.id; sync(); } else render();
  });

  peer.on('disconnected', ()=>{           // iOS froze the tab; the peer object is still good
    if(NET.role!=='host') return;
    NET.status='reconnecting'; render(); hostWake();
  });

  peer.on('error', e=>{
    noteErr('peer: '+e.type+' — '+(e.message||''));
    if(e.type==='unavailable-id' && tries<8){
      try{peer.destroy()}catch(x){}
      // the old session can hold the code for a few seconds — wait it out before giving up on it
      setTimeout(()=>hostRoom(tries+1, fixedCode, restore), fixedCode ? 2000 : 0);
      return;
    }
    try{ peer.destroy(); }catch(x){}          // otherwise PeerJS keeps retrying and spams errors
    NET.peer=null; NET.role='idle'; NET.status=''; G=null;
    UI.err = explainPeerError(e);
    render();
  });

  peer.on('connection', conn=>{
    const pid = conn.metadata && conn.metadata.id;
    const nm  = conn.metadata && conn.metadata.name;
    conn.on('open', ()=>{
      if(!pid){ conn.close(); return; }
      if(!G.players.some(p=>p.id===pid)){
        if(G.phase!=='lobby'){ conn.send({t:'deny', why:'That table already started.'}); setTimeout(()=>conn.close(),300); return; }
        if(G.players.length>=4){ conn.send({t:'deny', why:'That table is full — 4 players already.'}); setTimeout(()=>conn.close(),300); return; }
        G.players.push({id:pid, name:String(nm||'Player').slice(0,12)});
        G.scores = new Array(sideCount(G)).fill(0);
      }
      // a reconnecting phone arrives on a new channel; retire the one it replaces
      const old = NET.conns.get(pid);
      if(old && old!==conn){ old._retired = true; try{ old.close(); }catch(e){} }
      const fresh = !NET.conns.has(pid);
      NET.conns.set(pid, conn);
      NET.seen.set(pid, Date.now());
      if(NET.status==='reconnecting') NET.status='ready';
      sync();
      if(fresh){
        const who = (G.players.find(p=>p.id===pid)||{}).name || 'Someone';
        rtSys(who + (G.phase==='lobby' ? ' joined the table' : ' is back'));
      }
      try{
        conn.send({t:'rt', e:{k:'history', items:TALK.log.slice(-25)}});
        TALK.voice.forEach(vp=>conn.send({t:'rt', e:{k:'voice', on:true, pid:vp}}));
      }catch(e){}
    });
    conn.on('data', m=>{
      if(!m) return;
      NET.seen.set(pid, Date.now());
      if(m.t==='act') applyAction(pid, m.a);
      else if(m.t==='rt') rtIn(pid, m.e);
      else if(m.t==='ping'){ try{ conn.send({t:'pong'}); }catch(e){} }
    });
    conn.on('close', ()=>{
      // a stale channel closing must never unseat the live one that replaced it
      if(conn._retired || NET.conns.get(pid)!==conn) return;
      NET.conns.delete(pid); NET.seen.delete(pid);
      if(TALK.voice.delete(pid)){ const e={k:'voice', on:false, pid}; rtApply(e); rtFan(e, null); }
      TALK.speaking.delete(pid); paintSpeaking();
      const gone = (G && G.players.find(p=>p.id===pid)||{}).name;
      if(gone) rtSys(gone + (G && G.phase==='lobby' ? ' left the table' : ' dropped out — waiting for them'));
      if(G && G.phase==='lobby'){
        G.players = G.players.filter(p=>p.id!==pid);
        G.scores = new Array(sideCount(G)).fill(0);
      }
      sync();
    });
  });
}

/* ---------- guest ---------- */
let RETRY = null;

function guestAttach(peer, code){
  // never leave a second channel open to the same host: the old one's `close`
  // would otherwise look like a fresh disconnect and start another retry
  const prev = NET.host;
  if(prev){ prev._retired = true; try{ prev.close(); }catch(e){} }

  const conn = peer.connect(PREFIX+code, {reliable:true, metadata:{id:ME.id, name:ME.name}});
  NET.host = conn;
  conn.on('open', ()=>{
    if(NET.host!==conn){ try{ conn.close(); }catch(e){} return; }
    NET.joined=true; NET.status='ready'; NET.hostSeen=Date.now();
    clearTimeout(NET.joinTimer);
    clearTimeout(RETRY); RETRY=null;        // we are in — stop dialling
    render(); voiceSync();
    setTimeout(()=>rtSend({k:'voice', on: TALK.micState==='on'}), 400);
  });
  conn.on('data', m=>{
    if(!m) return;
    NET.hostSeen = Date.now();
    if(m.t==='state') onRemoteState(m.g);
    else if(m.t==='rt') rtApply(m.e);
    else if(m.t==='ping'){ try{ conn.send({t:'pong'}); }catch(e){} }
    else if(m.t==='deny'){ NET.joined=false; toast(m.why); leave(); }
  });
  conn.on('close', ()=>{
    if(conn._retired || NET.host!==conn) return;
    if(NET.role!=='guest' || !NET.joined) return;
    NET.status='reconnecting'; render();   // keep the board on screen, keep trying
    guestRetry(code);
  });
  conn.on('error', ()=>{});
}

function guestRetry(code){
  clearTimeout(RETRY); RETRY=null;
  if(NET.role!=='guest') return;
  RETRY = setTimeout(()=>{
    RETRY = null;
    if(NET.role!=='guest') return;
    if(NET.host && NET.host.open){         // it came back on its own
      if(NET.status!=='ready'){ NET.status='ready'; render(); }
      return;
    }
    const peer = NET.peer;
    if(!peer || peer.destroyed){ guestRebuild(code); return; }
    if(peer.disconnected){ try{ peer.reconnect(); }catch(e){} }
    guestAttach(peer, code);
    guestRetry(code);                      // one timer at a time, cleared the moment we are in
  }, 3000);
}

/* the Peer object itself died — build a new one and walk back in on the same code */
function guestRebuild(code){
  if(NET.role!=='guest' || typeof Peer==='undefined') return;
  let peer;
  try{ peer = new Peer(PEER_OPTS); }catch(e){ noteErr('rebuild: '+e.message); guestRetry(code); return; }
  NET.peer = peer;
  voiceAttach(peer);
  peer.on('error', e=>{ noteErr('peer: '+e.type); guestRetry(code); });
  peer.on('open', ()=>{ guestAttach(peer, code); });
  guestRetry(code);
}

function onRemoteState(g){
  const prev = G && G.round ? bCount(G.round.board) : 0;
  G = g;
  if(!G.round || bCount(G.round.board) < prev) UI.animUpTo = G.round ? bCount(G.round.board) : 0;
  UI.sel = null;
  if(NET.status==='reconnecting'){ NET.status='ready'; clearTimeout(RETRY); RETRY=null; }
  render();
  voiceSync();
}

/* one place that wakes everything back up when the app comes to the front */
function wake(){
  if(document.hidden) return;
  if(NET.role==='host') hostWake();
  else if(NET.role==='guest' && NET.joined && NET.host && !NET.host.open){
    clearTimeout(RETRY);
    const peer=NET.peer;
    if(peer && !peer.destroyed){
      if(peer.disconnected){ try{ peer.reconnect(); }catch(e){} }
      guestAttach(peer, G ? G.code : UI.code);
      guestRetry(G ? G.code : UI.code);
    }
  }
}

/* ---------- sound ---------- */
let AC=null;
function click(){
  if(!UI.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, len=0.07;
    const buf=AC.createBuffer(1, AC.sampleRate*len, AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3.2);
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1750; f.Q.value=1.1;
    const g=AC.createGain(); g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
  }catch(e){}
}

/* ---------- tile markup ---------- */
const PIPMAP={0:[],1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function half(v){
  const on=PIPMAP[v], cls=v===6?'pip p6':'pip';
  let s='<div class="half">';
  for(let i=1;i<=9;i++) s += on.includes(i) ? `<i class="${cls}"></i>` : '<i></i>';
  return s+'</div>';
}
function tileHTML(t, horizontal, extra, flip){
  const a = flip ? t[1] : t[0], b = flip ? t[0] : t[1];
  return `<div class="tile ${horizontal?'h':''} ${extra||''}">${half(a)}${half(b)}</div>`;
}

/* ---------- chain layout: wrap at the edge and run back the other way ---------- */
function isLandscape(){ return window.innerWidth > window.innerHeight && window.innerHeight < 560; }

function laneWidth(){
  const el = document.getElementById('lane');       // the previous render is still mounted here
  if(el && el.clientWidth > 60) return el.clientWidth - 30;
  const land = isLandscape();
  return Math.min(window.innerWidth, land ? window.innerWidth : 520) - (land?28:24) - 30;
}

function splitRows(board, u, gap, W){
  const rows=[]; let cur=[], w=0;
  for(const t of board){
    const tw = t.d ? u : 2*u;
    if(cur.length && w + gap + tw > W){ rows.push(cur); cur=[]; w=0; }
    w += (cur.length ? gap : 0) + tw;
    cur.push(t);
  }
  if(cur.length) rows.push(cur);
  return rows;
}

/* one size for the whole table: main line plus both branches, nothing clipped.
   `res` reserves room for the dashed drop slots that appear while a tile is held. */
function layoutTable(b, res){
  const W=laneWidth(), land=isLandscape(), gap=3;
  const maxRows = land ? 3 : 6, minU = 20, maxU = land ? 30 : 34;
  const TETHER = 54;                       // branch label + panel padding
  let u = maxU, plan;
  for(;;){
    const slot = u*1.4 + gap;
    const mainW = W - (res.l?slot:0) - (res.r?slot:0);
    const armW  = k => W - TETHER - (res[k]?slot:0);
    plan = {
      u,
      lineRows: splitRows(b.line, u, gap, mainW),
      aRows: b.a.length ? splitRows(b.a, u, gap, armW('a')) : [],
      bRows: b.b.length ? splitRows(b.b, u, gap, armW('b')) : []
    };
    const total = plan.lineRows.length + plan.aRows.length + plan.bRows.length;
    if(total <= maxRows || u <= minU) break;
    u -= 1;
  }
  return plan;
}

function wireHome(){
  const nm=document.getElementById('nm'), cd=document.getElementById('cd');
  nm.addEventListener('input',()=>{ ME.name=nm.value; });
  cd.addEventListener('input',()=>{ UI.code=cd.value.toUpperCase().replace(/[^A-Z0-9]/g,''); cd.value=UI.code; });
  document.getElementById('create').onclick=createRoom;
  document.getElementById('join').onclick=joinRoom;
  document.getElementById('solo').onclick=startLocal;
  const rs=document.getElementById('resume');
  if(rs) rs.onclick=()=>{
    const sv=SAVED; if(!sv) return;
    ME.name = sv.g.players.find(p=>p.id===ME.id)?.name || ME.name;
    LOCAL=false; G=null;
    hostRoom(0, sv.code, sv.g);

function needName(){
  const n=(ME.name||'').trim();
  if(!n){ UI.err='Add your name first.'; render(); return null; }
  return n.slice(0,12);
}

function createRoom(){
  const n=needName(); if(!n) return;
  ME.name=n; lset('me', ME);
  LOCAL=false;
  hostRoom(0);
}

function joinRoom(){
  const n=needName(); if(!n) return;
  if(UI.code.length!==4){ UI.err='The code is 4 letters.'; render(); return; }
  if(typeof Peer==='undefined'){ UI.err='Networking script did not load. Reload the page.'; render(); return; }
  ME.name=n; lset('me', ME);
  LOCAL=false; NET.role='guest'; NET.status='connecting'; NET.joined=false; UI.err=''; render();

  const peer = new Peer(PEER_OPTS);
  NET.peer = peer;
  voiceAttach(peer);
  const code = UI.code;
  const fail = (m)=>{
    if(NET.joined) return;                 // already in the game — never tear it down
    clearTimeout(NET.joinTimer); clearTimeout(RETRY);
    try{ peer.destroy(); }catch(e){}
    NET.role='idle'; NET.status=''; NET.host=null; G=null; UI.err=m; render();
  };
  NET.joinTimer = setTimeout(()=>fail('No answer from table '+code+'. Check the code, and that the host still has the page open.'), 12000);

  peer.on('error', e=>{
    noteErr('peer: '+e.type+' — '+(e.message||''));
    if(NET.joined){ guestRetry(code); return; }
    if(e.type==='peer-unavailable') fail('No open table with code '+code+'.');
    else fail(explainPeerError(e));
  });
  peer.on('disconnected', ()=>{ if(NET.joined){ NET.status='reconnecting'; render(); guestRetry(code); } });
  peer.on('open', ()=>guestAttach(peer, code));
}

function startLocal(){
  const n=(ME.name||'').trim()||'P1';
  LOCAL=true; NET.role='local'; UI.err='';
  G=newGame('LOCAL',{id:'p0',name:n});
  G.players=[{id:'p0',name:n},{id:'p1',name:'P2'},{id:'p2',name:'P3'},{id:'p3',name:'P4'}];
  G.scores=[0,0];
  render();
}

function wireLobby(){
  const cp=document.getElementById('copy');
  if(cp) cp.onclick=async()=>{

      await navigator.clipboard.writeText(url||G.code); toast(url?'Invite link copied':'Code copied');
    }catch(e){ toast('Your code is '+G.code); }
  };
  const mt=document.getElementById('m-teams'), ms=document.getElementById('m-solo');

function leave(){
  clearTimeout(RETRY); RETRY=null; clearTimeout(NET.joinTimer);
  voiceStop();
  TALK.log.length=0; TALK.unread=0; TALK.open=false; TALK.tray=false; TALK.draft='';
  NET.joined=false; NET.seen.clear(); NET.hostSeen=0;
  try{ if(NET.peer) NET.peer.destroy(); }catch(e){}
  NET.peer=null; NET.host=null; NET.conns.clear(); NET.role='idle'; NET.status='';

/* ---------- game ---------- */
function mySeat(){
  if(LOCAL) return G.round ? G.round.turn : 0;
  return G.players.findIndex(p=>p.id===ME.id);
}
function gameHTML(){
  const r=G.round, seat=mySeat(), myTurn = r && r.turn===seat;
  const ev = endsInfo(r.board);
  const hand = r.hands[G.players[seat].id] || [];
  const ns=sideCount(G);

  /* scoreboard */
  const best=Math.max(...G.scores);
  const heads=G.scores.map((sc,i)=>`
    <div class="sideplate ${sc===best&&sc>0?'is-lead':''}" style="--sc:${SIDE_COLORS[i]}">
      <div class="nm">${esc(G.mode==='teams'?TEAM_NAMES[i]+' · '+sideMembers(G,i).map(p=>p.name).join(' + '):sideName(G,i))}</div>
      <div class="sc" id="sp${i}">${sc}</div>
    </div>`).join('');

  /* seats */
  const on = G.online || [];
  const strip=G.players.map((p,i)=>`
    <div class="seatpip ${r.turn===i?'is-turn':''} ${on.length&&on[i]===false?'off':''}">
      <div class="n">${esc(p.name)}</div>
      <div class="c">${on.length&&on[i]===false?'away':r.hands[p.id].length+' tiles'}</div>
    </div>`).join('');

  /* the table: main line down the middle, spinner branches above and below it */
  const SIDE_LABEL = {l:'◀ left', r:'right ▶', a:'▲ branch', b:'▼ branch'};
  const selTile = (myTurn && UI.sel!=null) ? hand[UI.sel] : null;
  const selFits = selTile ? fitSides(r.board, selTile) : {};
  const grew = bCount(r.board) > UI.animUpTo;
  const newSide = grew && G.lastAct && G.lastAct.type==='play' ? G.lastAct.side : null;

  /* rows alternate direction and mirror their pips, so the chain always reads through */
  function rowsHTML(rows, markNew){
    let k=0;
    return rows.map((row, ri)=>{
      const rev = ri%2===1;
      return `<div class="crow ${rev?'rev':''}">` +
        row.map(b=>tileHTML(b.t, !b.d, markNew(k++), rev)).join('') + `</div>`;
    }).join('');
  }

  function armBlock(key, plan){
    const arm = r.board[key], rows = key==='a' ? plan.aRows : plan.bRows;
    const targetable = !!selFits[key];
    if(!arm.length && !targetable) return '';
    const body = rowsHTML(rows, i => (newSide===key && i===arm.length-1) ? 'is-new' : '');
    const ghost = targetable ? `<button class="slot" data-side="${key}"></button>` : '';
    return `<div class="arm">
      <span class="tether">branch<b>${spinVal(r.board)}</b></span>
      <div class="armrows">${body}${ghost?`<div class="crow">${ghost}</div>`:''}</div></div>`;
  }

  let chain;
  if(r.board.line.length){
    const plan = layoutTable(r.board, selFits);
    const last = r.board.line.length-1;
    const body = rowsHTML(plan.lineRows, i =>
      `${(newSide==='l'&&i===0)||(newSide==='r'&&i===last) ? 'is-new':''} ${i===r.board.sp?'spin':''}`);
    const lg = selFits.l ? `<button class="slot" data-side="l"></button>` : '';
    const rg = selFits.r ? `<button class="slot" data-side="r"></button>` : '';
    chain = `<div class="table" style="--unit:${plan.u}px">
      ${armBlock('a', plan)}
      <div class="mainline">${lg}<div class="chain">${body}</div>${rg}</div>
      ${armBlock('b', plan)}
    </div>`;
  } else {
    chain = `<div class="empty-felt">${esc(G.players[r.turn].name)} opens the round</div>`;
  }

  /* live count across two, three or four open ends */
  const scoring = ev.total%5===0 && ev.total>0;
  const counted = ev.lone ? [{val:ev.total}] : ev.list.filter(e=>!e.empty);
  const endsBar = ev.list.length ? `
    <div class="ends ${scoring?'is-score':''}">
      ${counted.map(e=>`<span class="v">${e.val}</span>`).join('<span>+</span>')}
      <span>=</span><span class="tot">${ev.total}${scoring?' ✓':''}</span>
    </div>` : '';

  /* end picker — one button per open end this tile actually fits */
  let picker='';
  if(selTile){
    if(r.board.line.length){
      const open = ev.list.filter(e=>selFits[e.side]);
      picker = `<div class="picker ${open.length>2?'grid':''}">` + open.map(e=>{
        const c = previewCount(r.board, selTile, e.side);
        const gain = c%5===0 && c>0;
        return `<button class="pk ${gain?'gain':''}" data-side="${e.side}">
          <div class="lb">${SIDE_LABEL[e.side]} · on ${e.match}</div>
          <div class="vl">${c}${gain?' · +'+c:''}</div></button>`;
      }).join('') + `</div>`;
    } else {
      const c = isDouble(selTile) ? selTile[0]*2 : pips(selTile);
      picker = `<div class="picker"><button class="pk ${c%5===0&&c>0?'gain':''}" data-side="r">
        <div class="lb">open the round with this</div><div class="vl">${c}${c%5===0&&c>0?' · +'+c:''}</div></button></div>`;
    }
  }

  /* action bar */
  const canAny = canPlayAny(r.board, hand);
  let bar='';
  if(myTurn){
    if(canAny) bar=`<div class="turnbar mine"><span class="lamp on"></span><div class="msg">Your move${LOCAL?' — '+esc(G.players[seat].name):''}<small>${armsOpen(r.board)?'Four ends are open — pick one':'Tap a tile, then pick an end'}</small></div></div>`;
    else if(r.bone.length) bar=`<div class="turnbar mine"><span class="lamp on"></span><div class="msg">Nothing fits<small>${r.bone.length} in the boneyard</small></div><button class="btn" id="draw">Draw</button></div>`;
    else bar=`<div class="turnbar mine"><span class="lamp on"></span><div class="msg">Nothing fits, boneyard empty</div><button class="btn" id="pass">Pass</button></div>`;
  }else{
    const who=G.players[r.turn].name;
    bar=`<div class="turnbar"><span class="lamp on"></span><div class="msg">${esc(who)} is thinking<small>${lastActLine()}</small></div></div>`;
  }

  /* hand */
  const handHTML = hand.map((t,i)=>{
    const ok = myTurn && Object.keys(fitSides(r.board,t)).length>0;
    return tileHTML(t,false,`${ok?'playable':''} ${myTurn&&!ok?'dead':''} ${UI.sel===i?'sel':''}`).replace('<div class="tile','<div data-i="'+i+'" class="tile');
  }).join('');

  return `
  ${mast(`${LOCAL?'hot-seat':'table '+G.code} · to ${G.target}<br>round ${G.roundNo}`)}
  ${NET.status==='reconnecting'?`<div class="wire"><span class="lamp on"></span>Reconnecting — the table is still here, hold on</div>`:''}
  <div class="topbar"><div class="board-head">${heads}</div><div class="seatstrip">${strip}</div></div>
  <div class="felt">${endsBar}<div class="lane" id="lane">${chain}</div>${picker}</div>
  ${bar}
  <div class="hand" id="hand">${handHTML}</div>
  ${sheetHTML()}
  <div style="display:flex;gap:10px;align-items:center;margin-top:12px">
    <button class="linkbtn" id="snd">${UI.sound?'Sound on':'Sound off'}</button>
    <button class="linkbtn" id="leave">Leave table</button>
  </div>
  ${G.phase==='roundover'?roundModal():''}
  ${G.phase==='matchover'?matchModal():''}`;
}

function lastActLine(){
  const a=G.lastAct; if(!a) return '';
  const nm=a.seat!=null?G.players[a.seat].name:'';
  if(a.type==='play') return `${nm} played ${a.tile[0]}–${a.tile[1]}${a.got?` · +${a.got}`:''}`;
  if(a.type==='draw') return `${nm} drew from the boneyard`;
  if(a.type==='pass') return `${nm} passed`;
  if(a.type==='deal') return `${nm} opens`;
  return '';
}

function sheetHTML(){
  if(!G.sheet.length) return '';
  const ns=sideCount(G);
  const cols=`grid-template-columns:32px repeat(${ns},1fr)`;
  const head=`<div class="rn hd"></div>`+G.scores.map((_,i)=>
    `<div class="hd cl" style="color:${SIDE_COLORS[i]}">${esc(G.mode==='teams'?TEAM_NAMES[i]:sideName(G,i))}</div>`).join('');
  const rows=G.sheet.map(s=>
    `<div class="rn">${s.n}</div>`+s.gained.map(g=>`<div class="cl ${g?'':'zero'}">${g||'·'}</div>`).join('')
  ).join('');
  const ttl=`<div class="rn ttl"></div>`+G.scores.map(s=>`<div class="cl ttl">${s}</div>`).join('');
  return `<div class="plate sheet" style="margin-top:12px">
    <h3>Score sheet</h3>
    <div class="sheetgrid" style="${cols}">${head}${rows}${ttl}</div>
  </div>`;
}

function roundModal(){
  const e=G.endInfo, isHost=LOCAL||G.host===ME.id;
  const title = e.reason==='domino' ? 'Domino!' : 'Table locked';
  const who = e.winner!=null ? (G.mode==='teams'?TEAM_NAMES[e.winner]:sideName(G,e.winner)) : null;
  const why = e.winner==null
    ? 'Both sides held the same pips. Nothing is written down.'
    : e.pts===0
      ? (e.reason==='domino'
          ? `${esc(G.players[e.winSeat].name)} went out, but what was left rounds down to nothing.`
          : `${who} held the fewer pips, but the difference rounds down to nothing.`)
      : (e.reason==='domino'
          ? `${esc(G.players[e.winSeat].name)} went out. ${who} takes ${e.pts} for the pips left on the table.`
          : `${who} held the fewer pips and takes ${e.pts}.`);
  return `<div class="scrim"><div class="modal">
    <div class="crown">Round ${G.roundNo}</div>
    <h2>${title}</h2><p class="why">${why}</p>
    <div class="board-head">${G.scores.map((sc,i)=>`<div class="sideplate" style="--sc:${SIDE_COLORS[i]}"><div class="nm">${esc(G.mode==='teams'?TEAM_NAMES[i]:sideName(G,i))}</div><div class="sc">${sc}</div></div>`).join('')}</div>
    ${isHost?`<button class="btn btn--wide" id="next" style="margin-top:14px">Deal round ${G.roundNo+1}</button>`
            :`<p class="muted" style="margin-top:14px">Waiting for ${esc(G.players.find(p=>p.id===G.host)?.name||'the host')} to deal the next round.</p>`}
  </div></div>`;
}
function matchModal(){
  const w=G.over.side, isHost=LOCAL||G.host===ME.id;
  const who=G.mode==='teams'?`${TEAM_NAMES[w]} — ${sideMembers(G,w).map(p=>p.name).join(' and ')}`:sideName(G,w);
  return `<div class="scrim"><div class="modal">
    <div class="crown">${G.roundNo} rounds · to ${G.target}</div>
    <h2>${esc(who)} wins</h2>
    <p class="why">Final score ${G.scores.join(' – ')}.</p>
    ${sheetHTML()}
    ${isHost?`<button class="btn btn--wide" id="again" style="margin-top:14px">Play again</button>`
            :`<p class="muted" style="margin-top:14px">Waiting for the host to start a new match.</p>`}
  </div></div>`;
}

/* the hand still shrinks to stay on one screen-width */
function fitBoard(){
  const hand=document.getElementById('hand');
  if(hand && hand.children.length){
    const n=hand.children.length, gap=7;
    const avail=hand.clientWidth-4;
    const max=isLandscape()?36:44;
    const u=(avail - gap*(n-1))/n;
    hand.style.setProperty('--hunit', Math.max(26, Math.min(max, u)).toFixed(1)+'px');
  }
}

function wireGame(){
  fitBoard();
  UI.animUpTo = bCount(G.round.board);

  const seat=mySeat(), myTurn=G.round.turn===seat && G.phase==='playing';

  document.querySelectorAll('#hand .tile').forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.i;
      if(!myTurn){ toast('Not your turn yet'); return; }
      const t=G.round.hands[G.players[seat].id][i], f=fitSides(G.round.board,t);
      const open=Object.keys(f);
      if(!open.length){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),360); return; }
      if(UI.sel===i){ UI.sel=null; render(); return; }
      UI.sel=i;
      if(G.round.board.line.length && open.length===1){ commit(open[0]); return; }
      render();
    };
  });
  document.querySelectorAll('.pk, .slot').forEach(b=>{ if(!b.disabled) b.onclick=()=>commit(b.dataset.side); });

  const dr=document.getElementById('draw');
  if(dr) dr.onclick=()=>act({type:'draw'});
  const ps=document.getElementById('pass');
  if(ps) ps.onclick=()=>act({type:'pass'});
  const nx=document.getElementById('next');
  if(nx) nx.onclick=()=>{ startRound(G); UI.animUpTo=0; UI.sel=null; sync(); };
  const ag=document.getElementById('again');
  if(ag) ag.onclick=()=>{ G.scores=new Array(sideCount(G)).fill(0); G.sheet=[]; G.roundNo=0; G.lastWinnerSeat=null; G.over=null; startRound(G); UI.animUpTo=0; sync(); };
  const sn=document.getElementById('snd');
  if(sn) sn.onclick=()=>{ UI.sound=!UI.sound; if(UI.sound) click(); render(); };
  const lv=document.getElementById('leave');
  if(lv) lv.onclick=leave;
  afterRender();
}

function commit(side){
  const i=UI.sel; if(i==null) return;
  UI.sel=null;
  act({type:'play', i, side});
  render();
}

/* fires once per state change, on every device */
function afterRender(){
  if(!G || !G.lastAct) return;
  if(G.seq===UI.lastSeq) return;
  UI.lastSeq=G.seq;
  const a=G.lastAct;
  if(a.type==='play'||a.type==='draw'||a.type==='deal') click();
  if(a.type==='play' && a.got){
    const plate=document.getElementById('sp'+sideOf(G,a.seat));
    if(plate){ const r=plate.getBoundingClientRect(); flyPoints(r.left+r.width/2, r.top+8, '+'+a.got); }
  }
}


/* ============================================================
   Table talk — reactions, chat and push-to-talk.
   Everything here rides the same connections the game already has,
   sits in its own overlay outside #app so a re-render never disturbs
   a half-typed message, and is wrapped so a failure can never take
   the game down with it.
   ============================================================ */

const REACTIONS = ['👏','🔥','😂','😮','😤','🤝','🧠','🍀'];
const QUICK = ['Salam!','Gözəl gediş','Növbən','Bir dəqiqə','Afərin!','Getdik!','Oy, nə etdim','Yaxşı oyun'];

const TALK = {
  open:false, unread:0, tray:false, log:[], draft:'',
  speaking:new Set(),             // player ids transmitting right now
  out:null, micTrack:null, micState:'idle',   // idle | asking | on | denied
  voice:new Set(),                // players who have armed a microphone
  typing:new Map(),               // pid -> timer that clears a stale indicator
  mine:false, myTypeStop:null,    // whether we have told the table we are typing
  calls:new Map(), audio:new Map(), held:false
};

const TALKABLE = ()=> !!G && !LOCAL && (NET.role==='host' || NET.role==='guest');
const uid = ()=> Math.random().toString(36).slice(2,10);

function seatColor(pid){
  if(!G) return 'var(--brass)';
  const i = G.players.findIndex(p=>p.id===pid);
  if(i<0) return 'var(--brass)';
  return SIDE_COLORS[G.mode==='teams' ? i%2 : i];
}
function nameOf(pid){
  const p = G && G.players.find(x=>x.id===pid);
  return p ? p.name : '—';
}

/* ---------- transport ----------
   Guests post to the host, the host fans out to everyone else. The
   sender always shows its own message immediately, so the table never
   feels like it is waiting on the network to speak. */
function rtSend(e){
  if(!TALKABLE()) return;
  e.pid = ME.id; e.ts = Date.now(); e.id = e.id || uid();
  rtApply(e);
  try{
    if(NET.role==='host') rtFan(e, ME.id);
    else if(NET.host && NET.host.open) NET.host.send({t:'rt', e});
  }catch(x){ noteErr('rt send: '+x.message); }
}
function rtFan(e, exceptPid){
  NET.conns.forEach((c,pid)=>{
    if(pid===exceptPid) return;
    try{ if(c.open) c.send({t:'rt', e}); }catch(x){}
  });
}
/* host side: a guest said something */
function rtIn(pid, e){
  if(!e || typeof e!=='object') return;
  if(e.k==='history' || e.k==='sys') return;    // only the host speaks for the table
  e.pid = pid;                                  // never trust a claimed sender
  rtApply(e);
  if(NET.role==='host') rtFan(e, pid);
}

function rtApply(e){
  try{
    if(e.k==='ptt'){
      if(e.on) TALK.speaking.add(e.pid); else TALK.speaking.delete(e.pid);
      paintSpeaking();
      return;
    }
    if(e.k==='voice'){
      if(e.on) TALK.voice.add(e.pid); else TALK.voice.delete(e.pid);
      voiceSync(); paintDock();
      return;
    }
    if(e.k==='typing'){
      const t = TALK.typing.get(e.pid);
      if(t) clearTimeout(t);
      if(e.on) TALK.typing.set(e.pid, setTimeout(()=>{ TALK.typing.delete(e.pid); paintTyping(); }, 5000));
      else TALK.typing.delete(e.pid);
      paintTyping();
      return;
    }
    if(e.k==='history'){
      const have = new Set(TALK.log.map(m=>m.id));
      TALK.log = e.items.filter(m=>!have.has(m.id)).concat(TALK.log).slice(-60);
      if(TALK.open) paintLog();
      return;
    }
    if(e.k!=='chat' && e.k!=='react' && e.k!=='sys') return;
    // whatever they were typing, they have now said it
    if(e.k==='chat'){ const t=TALK.typing.get(e.pid); if(t) clearTimeout(t); TALK.typing.delete(e.pid); paintTyping(); }
    TALK.log.push(e);
    if(TALK.log.length>60) TALK.log.shift();
    if(e.k==='sys'){
      if(TALK.open) paintLog();
      bubble(e);
      return;
    }
    if(e.pid!==ME.id){
      if(TALK.open) paintLog(); else { TALK.unread++; paintDock(); }
      blip(e.k==='react');
    } else if(TALK.open) paintLog();
    bubble(e);
    if(e.k==='react') burst(e.emo, e.pid);
  }catch(x){ noteErr('rt apply: '+x.message); }
}

function rtSys(text){
  if(NET.role!=='host' || !TALKABLE()) return;
  const e = {k:'sys', text:String(text).slice(0,120), id:uid(), ts:Date.now()};
  rtApply(e); rtFan(e, null);
}
function sendChat(text){
  text = String(text||'').trim().slice(0,160);
  if(!text) return;
  rtSend({k:'chat', text});
}
function sendReact(emo){ rtSend({k:'react', emo}); }

/* ---------- the overlay ---------- */
let LIVE=null, FXSTACK=null;
function liveRoot(){
  if(LIVE && LIVE.isConnected) return LIVE;
  LIVE = document.createElement('div'); LIVE.id='live';
  document.body.appendChild(LIVE);
  FXSTACK = document.createElement('div'); FXSTACK.className='fxstack';
  LIVE.appendChild(FXSTACK);
  return LIVE;
}

/* called at the end of every render(): keeps the dock in step with the screen */
function liveRender(){
  const on = TALKABLE();
  document.body.classList.toggle('talk-on', on);
  if(!on){
    if(LIVE){ LIVE.remove(); LIVE=null; FXSTACK=null; }
    TALK.open=false; TALK.tray=false;
    return;
  }
  liveRoot();
  paintDock();
  paintSpeaking();
}

function paintDock(){
  const root = liveRoot();
  let d = root.querySelector('.dock');
  if(!d){
    d = document.createElement('div'); d.className='dock';
    d.innerHTML =
      `<button class="dbtn" id="d-react" aria-label="Send a reaction">😀</button>`+
      `<button class="dbtn" id="d-chat" aria-label="Open chat"><span>💬</span><span class="badge" hidden></span></button>`+
      `<button class="ptt" id="d-ptt"><span class="mic">🎙</span><span class="lb">Hold to talk</span></button>`;
    root.appendChild(d);
    d.querySelector('#d-react').onclick = ()=>{ TALK.tray=!TALK.tray; TALK.open=false; paintTray(); paintPane(); paintDock(); };
    d.querySelector('#d-chat').onclick  = ()=>{ TALK.open=!TALK.open; TALK.tray=false; if(TALK.open) TALK.unread=0; paintPane(); paintTray(); paintDock(); };
    wirePTT(d.querySelector('#d-ptt'));
  }
  const mic = TALK.micState;
  const others = Array.from(TALK.voice).filter(p=>p!==ME.id).length;
  const label = isLandscape()
    ? (mic==='denied' ? 'Mic off' : mic==='asking' ? 'Allow…' : TALK.held ? 'On air' : others ? others+' on mic' : 'Talk')
    : (mic==='denied' ? 'Mic blocked'
      : mic==='asking' ? 'Allow the mic…'
      : TALK.held ? 'On air'
      : others ? 'Hold to talk · '+others+' on mic'
      : 'Hold to talk');
  const badge = d.querySelector('.badge');
  badge.hidden = !TALK.unread;
  badge.textContent = TALK.unread>9 ? '9+' : String(TALK.unread);
  d.querySelector('#d-react').setAttribute('aria-expanded', String(TALK.tray));
  d.querySelector('#d-chat').setAttribute('aria-expanded', String(TALK.open));
  const ptt = d.querySelector('#d-ptt');
  ptt.querySelector('.lb').textContent = label;
  ptt.classList.toggle('live', TALK.held);
  ptt.classList.toggle('off', mic==='denied');
}

function paintTray(){
  const root = liveRoot();
  const old = root.querySelector('.tray'); if(old) old.remove();
  if(!TALK.tray) return;
  const t = document.createElement('div'); t.className='tray';
  t.innerHTML = `<div class="in">${REACTIONS.map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>`;
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    sendReact(b.dataset.e);
    TALK.tray=false; paintTray(); paintDock();
  });
  root.appendChild(t);
}

function paintPane(){
  const root = liveRoot();
  const old = root.querySelector('.chatpane');
  if(!TALK.open){ if(old) old.remove(); return; }
  if(old) return;                                  // keep it mounted; only the log repaints
  const p = document.createElement('div'); p.className='chatpane';
  p.innerHTML =
    `<div class="hd"><h3>Table talk</h3><button class="x" id="c-x" aria-label="Close">✕</button></div>`+
    `<div class="chatlog" id="c-log"></div>`+
    `<div class="quick">${QUICK.map(q=>`<button>${esc(q)}</button>`).join('')}</div>`+
    `<form class="chatform" id="c-form" autocomplete="off">`+
      `<input id="c-in" maxlength="160" placeholder="Say something…" value="${esc(TALK.draft)}">`+
      `<button type="submit" aria-label="Send">➤</button></form>`;
  root.appendChild(p);

  p.querySelector('#c-x').onclick = ()=>{ TALK.open=false; typingStop(); paintPane(); paintDock(); };
  p.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>sendChat(b.textContent));
  const inp = p.querySelector('#c-in');
  inp.addEventListener('input', ()=>{
    TALK.draft = inp.value;
    if(inp.value.trim()) typingPing(); else typingStop();
  });
  inp.addEventListener('blur', typingStop);
  p.querySelector('#c-form').onsubmit = (ev)=>{
    ev.preventDefault();
    typingStop();
    sendChat(inp.value);
    inp.value=''; TALK.draft=''; inp.focus();
  };
  paintLog();
}

function paintLog(){
  const box = document.getElementById('c-log');
  if(!box) return;
  const stick = box.scrollTop + box.clientHeight > box.scrollHeight - 40;
  if(!TALK.log.length){
    box.innerHTML = `<div class="none">Nothing said yet.<br>Tap a phrase below, or send a reaction.</div>`;
    return;
  }
  box.innerHTML = TALK.log.map(m=>{
    if(m.k==='sys') return `<div class="msg sys"><div class="tx">${esc(m.text)}</div></div>`;
    const nm = nameOf(m.pid), col = seatColor(m.pid);
    const body = m.k==='react' ? m.emo : esc(m.text);
    return `<div class="msg ${m.k==='react'?'emo':''}">`+
      `<span class="who" style="background:${col}">${esc((nm[0]||'?').toUpperCase())}</span>`+
      `<div class="bd"><div class="nm">${esc(nm)}${m.pid===ME.id?' · you':''}</div>`+
      `<div class="tx">${body}</div></div></div>`;
  }).join('');
  if(stick) requestAnimationFrame(()=>{ box.scrollTop = box.scrollHeight; });
}

/* a message shows for a few seconds even with the panel shut, so you
   never miss one without having to stare at a badge */
function bubble(e){
  if(TALK.open) return;
  liveRoot();
  const d = document.createElement('div');
  if(e.k==='sys'){
    d.className = 'bub sys';
    d.innerHTML = `<span class="tx">${esc(e.text)}</span>`;
  } else {
    const nm = nameOf(e.pid), col = seatColor(e.pid);
    d.className = 'bub ' + (e.k==='react'?'emo':'');
    d.innerHTML = `<span class="who" style="background:${col}">${esc((nm[0]||'?').toUpperCase())}</span>`+
      `<span class="tx"><b>${esc(nm)}</b>${e.k==='react'?e.emo:esc(e.text)}</span>`;
  }
  FXSTACK.insertBefore(d, FXSTACK.querySelector('.bub.typing'));
  const msgs = FXSTACK.querySelectorAll('.bub:not(.typing)');
  for(let i=0;i<msgs.length-3;i++) msgs[i].remove();
  const life = e.k==='react' ? 3200 : e.k==='sys' ? 4200 : 6000;
  setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>d.remove(),400); }, life);
}

function burst(emo, pid){
  // leave from the sender's seat when we can see it, so a reaction has an author
  let ox = innerWidth/2, oy = innerHeight - 120;
  const pips = document.querySelectorAll('.seatpip');
  const seat = (G && pid) ? G.players.findIndex(p=>p.id===pid) : -1;
  if(seat>=0 && pips[seat]){
    const r = pips[seat].getBoundingClientRect();
    ox = r.left + r.width/2; oy = r.bottom + 6;
  } else {
    const dk = document.querySelector('.dock');
    if(dk){ const r=dk.getBoundingClientRect(); ox = r.left + r.width/2; oy = r.top - 10; }
  }
  const n = 3;
  for(let i=0;i<n;i++){
    const d = document.createElement('div');
    d.className='burst'; d.textContent=emo;
    d.style.left = (ox + (Math.random()*44 - 22)) + 'px';
    d.style.top  = oy + 'px';
    d.style.setProperty('--rise', (120 + Math.random()*110)+'px');
    d.style.setProperty('--rot', (Math.random()*44-22)+'deg');
    d.style.animationDelay = (i*0.11)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 1800 + i*120);
  }
}

function paintTyping(){
  if(!LIVE || !FXSTACK) return;
  const old = FXSTACK.querySelector('.bub.typing');
  const who = Array.from(TALK.typing.keys()).filter(p=>p!==ME.id && G && G.players.some(x=>x.id===p));
  if(!who.length || TALK.open){ if(old) old.remove(); return; }
  const names = who.map(nameOf);
  const txt = names.length===1 ? names[0]+' is typing'
            : names.length===2 ? names.join(' and ')+' are typing'
            : 'several people are typing';
  const d = old || document.createElement('div');
  if(!old){ d.className='bub typing'; }
  d.innerHTML = `<span class="who" style="background:${seatColor(who[0])}">${esc((names[0][0]||'?').toUpperCase())}</span>`+
    `<span class="tx">${esc(txt)}<span class="dots"><i></i><i></i><i></i></span></span>`;
  FXSTACK.appendChild(d);          // always the line closest to the dock
}

/* tell the table we are mid-sentence, and stop saying so once we go quiet */
function typingPing(){
  if(!TALKABLE()) return;
  if(!TALK.mine){ TALK.mine = true; rtSend({k:'typing', on:true}); }
  clearTimeout(TALK.myTypeStop);
  TALK.myTypeStop = setTimeout(typingStop, 2600);
}
function typingStop(){
  clearTimeout(TALK.myTypeStop);
  if(!TALK.mine) return;
  TALK.mine = false;
  rtSend({k:'typing', on:false});
}

function paintSpeaking(){
  const pips = document.querySelectorAll('.seatpip');
  if(!pips.length || !G) return;
  G.players.forEach((p,i)=>{
    if(pips[i]) pips[i].classList.toggle('is-talk', TALK.speaking.has(p.id));
  });
}

/* a softer cousin of the tile click, so a message is heard without being a thud */
function blip(high){
  if(!UI.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(high?880:620,t);
    o.frequency.exponentialRampToValueAtTime(high?1320:880,t+.07);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.12,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+.19);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.21);
  }catch(x){}
}

/* ============================================================
   Push to talk — a small audio mesh alongside the data star
   ============================================================ */
/* The game is host-authoritative, but audio is not worth relaying through
   one phone, so every pair opens its own WebRTC audio call. The mic track
   is muted at the source until the button is held: nothing leaves the
   phone while the button is up. */

function silentStream(){
  // a live-but-silent track, so a call can be placed before the mic is granted
  AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  const dst = AC.createMediaStreamDestination();
  const osc = AC.createOscillator(), g = AC.createGain();
  g.gain.value = 0; osc.connect(g); g.connect(dst); osc.start();
  return dst.stream;
}
function outStream(){
  if(!TALK.out){ try{ TALK.out = silentStream(); }catch(x){ TALK.out = new MediaStream(); } }
  return TALK.out;
}

function voiceAttach(peer){
  try{
    peer.on('call', mc=>{
      const pid = (mc.metadata && mc.metadata.id) || mc.peer;
      try{ mc.answer(outStream()); }catch(x){ noteErr('answer: '+x.message); return; }
      bindCall(pid, mc);
    });
  }catch(x){ noteErr('voice attach: '+x.message); }
}

function bindCall(pid, mc){
  const prev = TALK.calls.get(pid);
  if(prev && prev!==mc){ try{ prev.close(); }catch(x){} }
  TALK.calls.set(pid, mc);
  mc.on('stream', s=>playRemote(pid, s));
  mc.on('close', ()=>{ if(TALK.calls.get(pid)===mc) TALK.calls.delete(pid); dropRemote(pid); });
  mc.on('error', ()=>{ if(TALK.calls.get(pid)===mc) TALK.calls.delete(pid); });
}

function playRemote(pid, stream){
  let a = TALK.audio.get(pid);
  if(!a){
    a = document.createElement('audio');
    a.autoplay = true; a.playsInline = true;
    a.style.display='none';
    document.body.appendChild(a);
    TALK.audio.set(pid, a);
  }
  a.srcObject = stream;
  a.play().catch(()=>{});          // blocked until a gesture on some browsers; a later one frees it
}
function dropRemote(pid){
  const a = TALK.audio.get(pid);
  if(a){ try{ a.srcObject=null; a.remove(); }catch(x){} TALK.audio.delete(pid); }
}

/* open any call this phone owes the table. Only the lower player id dials,
   so a pair never rings each other at the same time. */
function voiceSync(){
  try{
    if(!TALKABLE() || !G.peers || !NET.peer || NET.peer.destroyed) return;
    TALK.voice.forEach(pid=>{ if(!G.players.some(p=>p.id===pid)) TALK.voice.delete(pid); });
    if(!TALK.voice.size){ voiceIdle(); return; }   // nobody is on the mic — stay off the air
    for(const p of G.players){
      if(p.id===ME.id) continue;
      const remote = G.peers[p.id];
      const cur = TALK.calls.get(p.id);
      if(!remote){ if(cur){ try{cur.close()}catch(x){} TALK.calls.delete(p.id); dropRemote(p.id); } continue; }
      if(cur && cur.peer===remote) continue;
      if(cur){ try{cur.close()}catch(x){} TALK.calls.delete(p.id); }
      if(ME.id < p.id){
        const mc = NET.peer.call(remote, outStream(), {metadata:{id:ME.id}});
        if(mc) bindCall(p.id, mc);
      }
    }
    for(const pid of Array.from(TALK.calls.keys())){
      if(!G.players.some(p=>p.id===pid)){
        try{ TALK.calls.get(pid).close(); }catch(x){}
        TALK.calls.delete(pid); dropRemote(pid);
      }
    }
  }catch(x){ noteErr('voice sync: '+x.message); }
}
/* drop every call but keep the permission we were granted */
function voiceIdle(){
  if(!TALK.calls.size && !TALK.audio.size) return;
  TALK.calls.forEach(c=>{ try{c.close()}catch(x){} }); TALK.calls.clear();
  Array.from(TALK.audio.keys()).forEach(dropRemote);
  TALK.speaking.clear(); paintSpeaking();
}

function voiceStop(){
  TALK.calls.forEach(c=>{ try{c.close()}catch(x){} }); TALK.calls.clear();
  TALK.audio.forEach((a,pid)=>dropRemote(pid));
  TALK.speaking.clear();
  if(TALK.micTrack){ try{ TALK.micTrack.stop(); }catch(x){} }
  TALK.micTrack=null; TALK.out=null; TALK.micState='idle'; TALK.held=false;
  TALK.voice.clear();
}

async function micArm(){
  if(TALK.micState==='on' || TALK.micState==='asking') return TALK.micState==='on';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    TALK.micState='denied'; paintDock();
    toast('This browser will not share a microphone here');
    return false;
  }
  TALK.micState='asking'; paintDock();
  try{
    const s = await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video:false
    });
    const track = s.getAudioTracks()[0];
    track.enabled = false;                       // silent until the button is held
    TALK.micTrack = track;
    TALK.micState = 'on';
    // swap it into the stream every call already shares
    const out = outStream();
    out.getAudioTracks().forEach(t=>{ try{ out.removeTrack(t); t.stop(); }catch(x){} });
    out.addTrack(track);
    TALK.calls.forEach(mc=>{
      try{
        const pc = mc.peerConnection;
        if(!pc) return;
        const sender = pc.getSenders().find(x=>x.track && x.track.kind==='audio');
        if(sender) sender.replaceTrack(track);
        else pc.addTrack(track, out);
      }catch(x){}
    });
    TALK.voice.add(ME.id);
    rtSend({k:'voice', on:true});
    voiceSync();
    paintDock();
    return true;
  }catch(x){
    TALK.micState='denied'; paintDock();
    toast(x && x.name==='NotAllowedError' ? 'Microphone permission was declined' : 'No microphone available');
    return false;
  }
}

function pttOn(){
  if(TALK.held) return;
  if(TALK.micState!=='on'){ micArm().then(ok=>{ if(ok && TALK.wantHold) pttOn(); }); return; }
  TALK.held = true;
  TALK.micTrack.enabled = true;
  rtSend({k:'ptt', on:true});
  paintDock();
}
function pttOff(){
  TALK.wantHold = false;
  if(!TALK.held) return;
  TALK.held = false;
  if(TALK.micTrack) TALK.micTrack.enabled = false;
  rtSend({k:'ptt', on:false});
  paintDock();
}

function wirePTT(btn){
  if(!btn) return;
  const down = (ev)=>{
    ev.preventDefault();
    TALK.wantHold = true;
    try{ btn.setPointerCapture && ev.pointerId!=null && btn.setPointerCapture(ev.pointerId); }catch(x){}
    pttOn();
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', pttOff);
  btn.addEventListener('pointercancel', pttOff);
  btn.addEventListener('lostpointercapture', pttOff);
  btn.addEventListener('contextmenu', e=>e.preventDefault());
  // a keyboard user gets the same thing on the space bar
  btn.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); TALK.wantHold=true; pttOn(); } });
  btn.addEventListener('keyup',   e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); pttOff(); } });
}
// a pointerup that lands anywhere else must still cut the mic
window.addEventListener('pointerup', ()=>{ if(TALK.held||TALK.wantHold) pttOff(); });
window.addEventListener('blur', ()=>{ if(TALK.held||TALK.wantHold) pttOff(); });

/* ---------- boot ---------- */
let SAVED = null;
(function boot(){
  const sv = lget('save');
  if(sv && sv.g && Date.now()-sv.at < 6*60*60*1000 && sv.g.phase!=='matchover') SAVED = sv;
  const saved = lget('me');
  ME = saved && saved.id ? saved : { id:'u'+Math.random().toString(36).slice(2,10), name:'' };
  if(!saved) lset('me', ME);
  /* A phone fires `resize` every time it hides or shows its URL bar, which is
     to say on almost every scroll. Only the width and the orientation change
     what the table looks like, so a height-only resize is ignored — otherwise
     the screen is rebuilt mid-scroll, every animation restarts and the scroll
     position is restored to where it was a moment ago. */
  let rt=null, lastW=window.innerWidth, lastLand=isLandscape();
  const refit=(force)=>{
    clearTimeout(rt);
    rt=setTimeout(()=>{
      const w=window.innerWidth, land=isLandscape();
      if(force!==true && w===lastW && land===lastLand) return;
      lastW=w; lastLand=land;
      if(G) render(); else fitBoard();
    }, 140);
  };
  window.addEventListener('resize', ()=>refit(false));
  window.addEventListener('orientationchange', ()=>refit(true));
  document.addEventListener('visibilitychange', wake);
  window.addEventListener('pageshow', wake);
  window.addEventListener('focus', wake);
  window.addEventListener('online', wake);
  const q = new URLSearchParams(location.search).get('room');
  if(q) UI.code = q.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  render();
})();
